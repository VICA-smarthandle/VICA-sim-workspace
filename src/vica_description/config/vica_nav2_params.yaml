amcl:
  ros__parameters:
    # The saved map was created from the VICA Stage spawn pose. Reinitialize
    # AMCL there whenever localization starts or the simulator is reset.
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Isaac's odometry is ground truth, so the default 0.2 spreads the particle
    # cloud for noise that is not there and the pose wanders in corridors.
    # NOTE these belong back near 0.2 before running on the real robot.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # RPLIDAR A2, matching config/vica_2d.lua. 100.0 was not a tuning choice, it
    # was a placeholder: it tells the likelihood field to reason about returns
    # far beyond anything the sensor can produce, which blurs the match in
    # exactly the featureless corridors where localization is already hardest.
    # min 0.2 covers both A2 variants (A2M8 0.15 m, A2M12 0.2 m).
    laser_max_range: 12.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # 1.0, dev's, from 2026-09-02. This file had 0.3 on purpose, with the note
    # that 1.0 accepts transforms old enough to hide timing problems, and that
    # is still true. It is matched anyway: a tolerance the robot does not have
    # can drop transforms here that it would keep, and a controller comparison
    # is only worth reading if the localisation underneath it behaves the same.
    # Put 0.3 back when diagnosing timing rather than comparing controllers.
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # The robot's tree, with BackUp removed. A person walks behind holding the
    # handle; reversing drives the robot into them. Overridden by the launch
    # file with the installed path.
    default_nav_to_pose_bt_xml: "SET_BY_VICA_LAUNCH"
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 10.0, dev's. 0.3 declares FollowPath failed after 0.3 s of the
    # controller producing nothing, which a robot easing through a tight
    # turn does routinely.
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # 20.0, adopted from the robot, which moved off 10.0 on 2026-07-31.
      #
      # The check is only "did it move required_movement_radius within
      # movement_time_allowance". At 0.10/10.0 that demands a sustained
      # 0.01 m/s, and a robot easing through a tight turn is slower than that
      # for stretches -- so normal driving is scored as failure. The robot's
      # note calls this removing a false positive rather than adding patience,
      # and points out that with recovery behaviours disabled a false positive
      # ends the run outright instead of costing one Spin.
      #
      # It shows up here the same way. Goal (1.5, 1.2) with a 90 degree
      # heading change aborted six times on "Failed to make progress" while
      # the straight goal to (3.0, 0.0) succeeded untouched.
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      # StoppedGoalChecker and stateful: False, both from the robot.
      #
      # SimpleGoalChecker declares arrival on pose alone, so a robot still
      # carrying speed through the tolerance counts as arrived and coasts past.
      # StoppedGoalChecker also requires it to have slowed down. stateful:
      # False re-checks position every cycle instead of latching, so drifting
      # back out of tolerance while decelerating cannot be scored as success.
      #
      # This makes arrival take longer here, which is part of why the robot
      # needed movement_time_allowance above raised at the same time.
      stateful: False
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    FollowPathRPP:
      # Regulated Pure Pursuit. Values are the robot's second RPP run
      # (2026-08-29 `run1215`), which is the configuration that arrived.
      #
      # The first run (lookahead_time 1.5, min_lookahead_dist 0.45) stopped
      # 0.17 m short of goals and failed them 10 times. Close in, the path
      # remaining is shorter than min_lookahead_dist and there is no point
      # left to aim at. Raising both fixed it: goal failures 10 -> 0, action
      # timeouts 47 -> 1, recovery waits 24 -> 0.
      #
      # max_lookahead_dist 0.75 is NOT free to raise. It is set by the
      # corridor: aiming further cuts the corner by L/2 to L/1.41, and the
      # clearance available is 0.375 m.
      #
      # Why the robot did not keep it: RPP computes steering straight from the
      # current pose, so every tremor in localisation goes into the handle. A
      # person walking behind felt 0.115 m/s of lateral motion against DWB's
      # 0.047, with the turn direction reversing every 2.4 seconds. The user's
      # verdict was that it would injure someone holding on. Robot-side it won
      # everything -- keep-out entries 206 -> 4, recoveries 51 -> 0.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.50
      max_lookahead_dist: 0.75
      lookahead_time: 2.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Regulation. Both heuristics slow the robot rather than steer it, which
      # is why RPP needs no critics to stay off walls.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # The point of RPP for this robot: an explicit conditional, not a score
      # competition. Beyond 57 degrees it turns on the spot first. DWB has no
      # such rule -- in-place rotation there can only win 56 of 112 points
      # because it earns nothing on the two distance critics, so it loses
      # structurally and the robot gets stuck at U-turns.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.0
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      # No reversing. A person walks behind holding the handle; the behaviour
      # tree has BackUp removed for the same reason.
      allow_reversing: false
      use_collision_detection: true
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.5

    FollowPathMPPI:
      # Velocity and acceleration limits are the physical robot's measured
      # values (vica_nav2): 0.26 m/s and 0.4 rad/s, with acc_lim 2.0 after 2.5
      # was found to lurch on start. vx_min is 0 because the planner runs with
      # allow_reverse_expansion false, so nothing upstream asks for reverse.
      #
      # The robot runs DWB. MPPI was tried there on 2026-08-29 over four runs
      # and NOT adopted: its quality numbers beat DWB nearly everywhere --
      # handle sway 0.055 -> 0.029 m/s, rotation reversals 8.1 -> 1.6 per
      # minute, path deviation 0.043 -> 0.031 m -- but it did not arrive. At
      # the toilet goal (3.5, 5.4) DWB was 2/2 and MPPI 0/4, repeating
      # "Starting point in lethal space" and "no valid path found". For a
      # guide robot arrival is not negotiable.
      #
      # It is here so that judgement can be re-examined against a planner it
      # was never paired with. On the robot MPPI ran only under Lattice.
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 2.0
      ax_min: -2.0
      az_max: 2.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: 0.0
      wz_max: 0.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # 3.0 is nav2's default and it does not turn this robot. Measured with
        # the stack up, on an open floor with 2.1 m of clearance:
        #
        #   travel 2 m, no turn required   SUCCEEDED, 2.03 m, 17 s
        #   turn 90 deg on the spot        0 deg of rotation in 120 s
        #   turn 150 deg on the spot       125 deg, all of it from Spin
        #
        # The log names what moved it: "Running spin", "Turning 1.57 for spin
        # behavior", "spin completed successfully". Every degree of in-place
        # rotation seen here came from the recovery behaviour. MPPI commanded
        # none of it -- /cmd_vel_nav's angular z averaged -0.004 rad/s over a
        # whole goal, dithering rather than committing.
        #
        # 15.0, and it is an improvement rather than a fix.
        #
        # Raising it does make MPPI turn the robot itself. Three 90 degree
        # in-place goals per setting, each from a full stop on open floor:
        #
        #   weight   rotation achieved      net displacement   Spin recoveries
        #    3.0     0 deg                  --                 2
        #   15.0     8 / 77 / 46 deg        0.52 / 0.48 / 0.58 m   0
        #   32.0     73 / 166 / 177 deg     0.54 / 0.60 / 0.57 m   0
        #
        # At 3.0 the controller commands no rotation at all and the Spin
        # recovery does the work. Above that it commands its own, which is why
        # 15.0 is kept. 32.0 is not better: asked for 90 degrees it delivers 166
        # and 177, overshooting rather than converging.
        #
        # None of them reach the goal, and the displacement column is why. A
        # goal that asks for rotation without travel gets 0.5 m of travel every
        # time, which puts the robot outside xy_goal_tolerance 0.25, so the pose
        # is never satisfied however well it turns. With vx_min 0.0 the robot
        # cannot reverse out of that overshoot either -- correcting it means
        # driving a loop -- and the planner refuses reverse for the same reason.
        #
        # That is the part worth carrying to the robot, which also blocks
        # reverse. DWB's RotateToGoal commands zero linear velocity outright
        # during the final turn. MPPI has no critic that does this: it can be
        # asked to prefer the right heading, not to hold still while reaching
        # it. nav2's answer is RotationShimController, which was tried on the
        # robot with DWB and removed for triggering in-place turns that were not
        # needed -- worth revisiting with a threshold above the 45 degree
        # default, and with Lattice rather than the planner it was tried under.
        #
        # There is also a structural limit underneath: the horizon is 56 steps
        # of 0.05 s and wz_max is 0.4, so no sampled trajectory can turn more
        # than 64 degrees, and physics delivers about 60 % of what is commanded.
        # Past that every candidate ends up still facing the wrong way and they
        # score alike, which is what dithering looks like.
        #
        # This matters beyond simulation: the plan is to move the robot to MPPI
        # after validating it here, and in-place rotation is what that
        # validation has to cover.
        cost_weight: 15.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

    # The physical robot's controller, kept here so the two can be compared on
    # the same course instead of by argument. Inert while it is named
    # FollowPathAlt; select_controller swaps the names.
    #
    # Values are dev's, copied rather than re-tuned. Every one of them has a
    # reason recorded there and most were settled by driving:
    #
    #   ObstacleFootprint replaced BaseObstacle because BaseObstacle checks one
    #     cell at the trajectory's centre and assumes a round robot. VICA's
    #     inscribed and circumscribed radii differ by 2.5x, so a free centre
    #     says nothing about the 0.6 m tail. The swap cut slow-crawling from
    #     11.0 s to 7.9 s.
    #   ObstacleFootprint.scale 0.15 is a third try. At 0.08 avoiding an
    #     obstacle cost less than leaving the path by 3 cm, so the robot tracked
    #     paths that ran along walls. At 0.30 it got stuck: 46 s without moving
    #     where every trajectory scored as blocked.
    #   PathAlign.forward_point_distance 0.325 is nav2's default, restored after
    #     0.1 put the alignment point inside the robot, where it duplicated
    #     PathDist and left no heading information -- corners were noticed on
    #     arrival rather than in advance.
    #
    # Plugin and critic names are Jazzy's, checked against the installed
    # dwb_critics: they match Humble's here, unlike the Smac planners whose
    # slash form aborts planner_server on configure.
    FollowPath:
      # 2026-09-02: speeds raised to the robot's current values so the
      # controller comparison runs the conditions the robot ran. It had been
      # 0.26 / 0.4, which the robot left behind -- the note there says 0.26
      # "너무 느렸다". decel_lim_x came with it: dev is -1.5, not the -2.5
      # this file carried, and DWB choosing trajectories against a brake it
      # does not have is exactly the mismatch that caused a bumper contact on
      # the robot.
      #
      #     max_vel_x      0.26 -> 0.5
      #     max_speed_xy   0.26 -> 0.5
      #     max_vel_theta  0.4  -> 0.5
      #     decel_lim_x   -2.5  -> -1.5
      #     sim_time       2.5  -> 2.0   (below)
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      # 2.5, the robot's value. Its notes make the reason concrete: DWB looks ahead
      # in time, so sim_time x max_vel_x plus the footprint's nose is how far it
      # checks. 1.7 gives 0.80 m and 2.5 gives 1.01 m, and at 0.80 m a chair was
      # detected four seconds out and hit anyway because the check never reached
      # it.
      #
      # It also decides whether a narrow corner is passable at all, in the
      # opposite direction to intuition. The robot tried 2.0 and it was worse
      # than either: "No valid trajectories" went 74 -> 168 and the narrow route
      # was never once completed. A shorter horizon cannot draw the curve that
      # goes around an obstacle, only see that the way ahead is blocked.
      #
      # 2026-09-02: 2.0, following dev. The paragraph above is the robot's
      # reasoning from when max_vel_x was 0.26, where 2.5 s bought 1.01 m of
      # lookahead. At 0.5 m/s, 2.0 s buys 1.30 m -- further than 2.5 s ever
      # reached at the old speed. The horizon grew by raising the speed.
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.15
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      # 5 cm to match the lattice primitive set (5cm_resolution) and the
      # physical robot's costmap; a finer grid here would not be reflected in
      # the motion primitives the planner actually has.
      resolution: 0.05
      # Matches the physical robot's tuned footprint (vica_ros2_ws@dev). The
      # tail narrows to the mast width instead of staying full-width, which is
      # what lets the robot into gaps a bounding rectangle refuses.
      #
      # 2026-09-02: the tail came in from -0.595 to -0.415 and the half-width
      # from 0.2275 to 0.225, following the robot's 2026-08-29 tape measure
      # (handle 19 -> 11 cm, body 80 -> 72 cm). Padded radii move with it:
      #
      #     inscribed      0.2775 -> 0.2750   barely moves: the nearest edge
      #                                       is the side, and the sides did
      #                                       not move
      #     circumscribed  0.6506 -> 0.4727   turn-in-place 1.30 -> 0.95 m
      #
      # The circumscribed drop is what makes a controller comparison possible
      # here at all. nav2 wants inflation_radius >= circumscribed to use the
      # costmap potential field; at 0.6506 it could not, said so every planner
      # cycle, and fell through to a full polygon check on every scored pose.
      # At 0.4727 the 0.55 inflation clears it.
      footprint: "[[0.305, 0.225], [0.305, -0.225], [-0.305, -0.225], [-0.415, -0.035], [-0.415, 0.035], [-0.305, 0.225]]"
      footprint_padding: 0.05
      plugins: ["voxel_layer", "range_sensor_front_left", "range_sensor_front_right", "inflation_layer"]
      # The two DYP-A22 probes, values from dev. They sit at ground 0.091,
      # where the lidar plane (0.382) and the depth band (0.30 to 1.05) both
      # see nothing, so anything shorter than about 30 cm is theirs alone.
      #
      # Live since 2026-09-02. The probes are RTX lidars, cut down to the
      # DYP-A22's 50 degree beam by scripts/ultrasonic_range.py, which also
      # supplies the numbers nav2 reads: 0.02 to 1.50 m and a 0.524 rad
      # field_of_view, all three copied from the robot's own
      # user_guidance.yaml so nav2 cannot tell the two apart.
      #
      # They were dead for a month behind env switches because the first
      # implementation used IsaacRaycastSensor, which segfaults the process a
      # few seconds into play. It was never the graphs.
      #
      # Checked against the geometry rather than just for a heartbeat, with the
      # robot parked in the 1.00 m corner cell facing its low box:
      #   right probe 0.547 m, box corner computed at 0.548
      #   left  probe 0.400 m, the corridor wall at the edge of the beam,
      #                        0.143 m sideways seen at about 21 degrees
      # The left reading is the real sensor behaving, not a fault: a 50 degree
      # beam in a 1.00 m corridor sees the wall, which is why the arc the
      # costmap draws is deliberately narrower than the one it hears.
      range_sensor_front_left:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_left"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_front_right:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_right"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Both values come from the physical robot. cost_scaling_factor 2.5 was
        # tried there and rejected: the falloff was slow enough to leave cost
        # sitting in the middle of a corridor. inflation_radius does not decide
        # passability -- the padded footprint does -- it only shapes the decay
        # outside the lethal band.
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        # 0 here, against the robot's 1, and the difference is not a drift.
        #
        # mark_threshold is the number of marked voxels a column needs before
        # the 2D cell goes lethal, and the test is strictly greater than. A 2D
        # laser marks exactly one voxel per column, so at 1 a scan-only voxel
        # layer can never mark anything: copying the robot's value emptied this
        # costmap completely -- 14400 cells, every one free, walls 2 m away
        # invisible.
        #
        # It costs the robot nothing because its costmap does not depend on
        # this layer for obstacles; an nvblox_layer sits beside it doing that
        # work. Take the value across without the layer that makes it safe and
        # the robot stops seeing.
        #
        # Raise it only once the depth cloud is the primary source, since dense
        # points do fill a column and would then benefit from the filtering.
        mark_threshold: 1
        # Two sources, which is the point of a VoxelLayer. Fed only the 2D scan
        # it returns the same answer as an ObstacleLayer for more work, and the
        # robot stays blind to anything the lidar plane at 0.382 m passes over:
        # a box on the floor, a chair seat, a foot.
        #
        # The robot solves this with an nvblox_layer -- Isaac ROS, Humble only,
        # no Jazzy build -- fusing depth into a TSDF and slicing a costmap out
        # of it. That handles a moving obstacle's history better than marking
        # raw points does, so this is the same intent by a simpler route, not
        # the same mechanism. Worth remembering when a dynamic-obstacle result
        # here is read as saying something about the robot.
        observation_sources: scan depth_scan
        # 2026-09-02: the raw point cloud is replaced by a 2D slice of it,
        # matching dev. pointcloud_to_laserscan flattens the depth band into a
        # LaserScan on /camera/depth_scan and this consumes that instead.
        #
        # The robot's reason, from its own config: a camera 1.045 m up cannot
        # clear a cell below it, because the ray that grazes that cell has to
        # reach far-off floor to do it (6.7 m for a cell 1.8 m out), and indoors
        # a wall 3 to 4 m ahead stops it. A lidar clears well precisely because
        # it looks at its own height. Pressing the depth into one plane gives it
        # the same property. Without this, marked cells never clear and the
        # costmap keeps an afterimage -- which in a 1 m corridor is a wall.
        depth_scan:
          topic: /camera/depth_scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: -0.05
          max_obstacle_height: 0.15
          obstacle_max_range: 3.0
          obstacle_min_range: 0.30
          raytrace_max_range: 3.5
          raytrace_min_range: 0.30
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Both values come from the physical robot. cost_scaling_factor 2.5 was
        # tried there and rejected: the falloff was slow enough to leave cost
        # sitting in the middle of a corridor. inflation_radius does not decide
        # passability -- the padded footprint does -- it only shapes the decay
        # outside the lethal band.
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      # Updates only: republishing a hospital-sized costmap every second is
      # bandwidth the RViz session does not need.
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      # Ported from the robot (vica_ros2_ws vica_nav2) on 2026-09-03. Until
      # then this file had no global_costmap section at all, so the planner ran
      # on nav2's defaults: a circular robot of the default radius, no static
      # layer settings of ours, and an obstacle layer nobody had looked at.
      #
      # That is not a small difference. The two costmaps must agree about the
      # robot's shape or the planner produces paths the controller then
      # refuses, and the robot stands in a corridor with a plan it cannot
      # follow. The robot's own config says so in as many words and has a test
      # named after it: test_local_and_global_costmap_use_the_same_footprint.
      #
      # It showed up here as a dynamic-obstacle trial where the robot stopped
      # 1.45 m short of a walker and never went round, with
      # "controller_server: Failed to make progress" in the log, on both DWB
      # and MPPI and in both a 2.0 m and a 2.4 m corridor.
      footprint: "[[0.305, 0.225], [0.305, -0.225], [-0.305, -0.225], [-0.415, -0.035], [-0.415, 0.035], [-0.305, 0.225]]"
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # The robot also lists a keepout filter here. Not ported: nothing in this
      # workspace publishes /keepout_costmap_filter_info, and a filter waiting
      # on a topic that never arrives is a costmap that never finishes
      # configuring. The courses have no keepout zones to declare.
      #
      # The robot's nvblox_layer is not ported either, and it is not in the
      # robot's own plugins list. The sim's equivalent camera path is
      # depth_scan, which feeds the local costmap's voxel layer.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          observation_persistence: 0.5
          expected_update_rate: 0.2
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      always_send_full_costmap: True

# The map YAML is supplied through the required `map` launch argument.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # Planner choice follows the physical robot (vica_ros2_ws vica_nav2), where
    # it was settled by measurement rather than preference:
    #
    #   NavFn      rejected 2026-07-28. Gradient descent oscillates between
    #              near-equal cells; only 2.5% of 5018 commands had the next
    #              1.5 m straight to within 10 deg, on corridors that were
    #              actually straight.
    #   Smac 2D    rejected 2026-07-30. Node2D::isNodeValid collision-checks a
    #              single cell, NodeHybrid checks the padded footprint at a
    #              pose. The planner called 74.9% of the free area traversable
    #              while the controller accepted 42.0% -- a 32.9pp gap that
    #              showed up as 20+ second stalls mid-corridor.
    #   Hybrid     works, but DUBIN/Reeds-Shepp primitives are arcs: there is
    #              no turn-in-place motion. At one repeatedly-failing pose the
    #              padded footprint was legal at yaw 0/45/90/135/180/315 and in
    #              collision at 225/270 -- reachable by rotating on the spot,
    #              not by a 0.5 m arc.
    #   Lattice    current choice. The diff primitive set includes 32 in-place
    #              rotations out of 112.
    #
    # Kept under the same "GridBased" key so swapping is a one-line change and
    # the behaviour tree does not care.
    GridBasedLattice:
      # Jazzy declares these with :: ; the physical robot's config uses the
# Humble-era slash form, and copying it verbatim gives
#   "the class nav2_smac_planner/SmacPlannerLattice ... does not exist"
# at planner_server configure, which aborts the whole navigation bringup.
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      # Placeholder. The launch file substitutes the installed path, the same
      # way it does the behaviour tree, because an install path differs per
      # machine. If the substitution is ever skipped the planner fails to find
      # the file rather than quietly falling back to a different lattice.
      #
      # R 0.10, generated by the robot's own team on 2026-08-29 and chosen
      # there by real driving (vica_ros2_ws bee377f). It replaces nav2's stock
      # 0.5 m set, which is not a tuning preference:
      #
      #     turn method            corridor needed
      #     in place                   0.945 m
      #     arc R 0.10 (this)          ~1.05 m
      #     arc R 0.30                  1.352 m
      #     arc R 0.50 (nav2 stock)     1.705 m
      #
      # nav2 ships only 0.5 m and 1 m. The toilet U-turn that failed on the
      # robot was in a 1.40 m corridor, which the stock lattice cannot turn in
      # at all -- so every arc it offered was unusable and the planner was
      # left proposing in-place rotations that DWB then would not execute.
      # This set has 48 in-place primitives out of 112, against the stock 32,
      # and small arcs besides.
      lattice_filepath: "SET_BY_VICA_LAUNCH"
      allow_reverse_expansion: false
      rotation_penalty: 5.0
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_penalty: 4.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

    # The three planners not currently loaded. Only the block named in
    # planner_plugins is read, so these are inert until select_controller
    # renames one of them to GridBased.
    #
    # Values every planner shares (tolerance, allow_unknown, the iteration and
    # time caps) are kept identical across all four on purpose. The real robot
    # has a contract test enforcing exactly that, and the reason is the same
    # here: one variable at a time, or the comparison measures nothing.

    GridBasedHybrid:
      # Smac Hybrid-A*. Continuous headings, Dubin curves, no in-place
      # rotation primitive at all -- it plans paths a car could drive.
      # minimum_turning_radius 0.50 with the 0.4727 circumscribed radius means
      # its tightest curve needs 1.705 m of corridor to U-turn, against
      # 0.945 m for turning on the spot. That is the axis being tested.
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.50
      cost_penalty: 4.0
      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

    GridBased:
      # NavFn. Dijkstra on the costmap, holonomic: it draws the shortest free
      # path with no notion that the robot cannot slide sideways, and hands
      # over a path with no headings in it. Feasibility is entirely the
      # controller's problem, which is what makes it the useful baseline --
      # it is the only one of the four that asks nothing of the robot's shape.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

    GridBased2D:
      # Smac 2D. Also holonomic and also headingless, but A* on the same grid
      # the other Smac planners use, with their cost_penalty and smoother. It
      # separates "what the search algorithm costs" from "what kinematic
      # feasibility costs" when read against NavFn and Lattice.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_penalty: 4.0
      use_final_approach_orientation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # The robot's values, and they are about the person rather than the robot.
    # Spin at 1.0 rad/s is six times the speed the controller slows to near a
    # goal, and its note records the complaint directly: the robot crept in and
    # then whipped round. min matters too -- spin.cpp clamps to it, so leaving
    # it at 0.4 removes the deceleration curve at the end of the turn entirely.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.15
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # The robot's values. Its smoother sits above DWB's 0.4 rad/s as a loose
    # safety net, not as a second limit -- so 1.0 here, and reverse allowed.
    #
    # 0.4 / 0.0 made this a hard ceiling instead, and clipped the one thing that
    # still needed headroom. behavior_server's Spin asks for 1.0 rad/s and got
    # 0.4, which physics then delivers about 60 % of: 0.24 rad/s, against 1.0 on
    # the robot. Recovery from a bad heading was four times weaker here than
    # there, in a simulator where turning was already the weak axis.
    #
    # min_velocity x is -0.26 for the same reason. Reverse is refused upstream,
    # by the planner's allow_reverse_expansion false and the controller's
    # vx_min 0.0, so nothing plans it -- but BackUp is a recovery, not a plan,
    # and clamping it to zero silently removes a recovery rather than a motion.
    # [0.5, 0, 1.0], dev's. This is the cap that actually governs: DWB was
    # raised to 0.5 on 2026-09-02 and the robot still ran at 0.26 because
    # the smoother sat below it. Measured on /cmd_vel: a flat 0.26.
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-1.25, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # Graded response: slow down when something enters the outer box, then let
    # the footprint check govern the last metre. A single approach polygon has
    # to choose between braking early everywhere and braking late in corners.
    # Disabled by "enabled: False" on both polygons below, not by removing them.
    #
    # Two shorter-looking routes both take the whole navigation stack down with
    # them, and neither says so in a way anyone would connect to a motionless
    # robot:
    #
    #   polygons: []      an empty YAML list has no type, rclcpp cannot infer
    #                     one, and the node aborts before it ever configures --
    #                     "parameter_value_from failed for parameter 'polygons':
    #                     No parameter value set"
    #   no polygons key   Jazzy declares the parameter without a default, so
    #                     configure fails on "parameter 'polygons' is not
    #                     initialized"
    #
    # The collision monitor sits in the navigation lifecycle group, so either
    # failure makes lifecycle_manager give up on the entire group: "Failed to
    # bring up all requested nodes. Aborting bringup." controller_server,
    # planner_server and bt_navigator all stay unconfigured, goals are never
    # accepted, and the visible symptom is a robot that does not move. The
    # cause scrolls past forty seconds before the first goal is sent.
    #
    # Keeping the polygons and disabling them leaves the node configured and
    # transparent: process() skips every disabled polygon, so cmd_vel_smoothed
    # reaches cmd_vel unchanged. Re-enabling is two booleans, and the simulator
    # subscribes to cmd_vel -- the monitor's output -- so a monitor turned back
    # on is actually exercised here rather than bypassed.
    #
    # With the two polygons below active, the monitor took every command and
    # published nothing at all. Measured during a goal:
    #
    #     /cmd_vel_nav        488 msgs, 487 non-zero, max |v| 0.096
    #     /cmd_vel_smoothed   492 msgs, 489 non-zero, max |v| 0.096
    #     /cmd_vel            no messages
    #
    # The robot never received a command and the controller reported "Failed to
    # make progress". Relaying cmd_vel_smoothed to cmd_vel by hand, changing
    # nothing else, moved it 5 m with zero progress failures -- the first
    # successful autonomous run here.
    #
    # The likely cause is the robot seeing itself. /scan returns 0.447 m astern,
    # off its own rear panel, matching base_link.stl to 3 mm. FootprintApproach
    # asks how long until the footprint reaches an obstacle at the current
    # velocity, and an obstacle permanently 0.447 m behind never stops being
    # imminent. The log agrees: "Robot to approach for 1.200000 seconds away
    # from collision", over and over.
    #
    # The physical robot runs no collision monitor at all, so nothing here is
    # lost by matching it. Before either of them gets one, the self-return has
    # to be dealt with -- an angular filter on the rear sector is the honest fix,
    # since it also clears the phantom obstacle the costmap otherwise carries
    # behind the robot forever. Turning these on without that would stop the
    # real robot exactly as it stopped this one.
    polygons: ["SlowDown", "FootprintApproach"]
    SlowDown:
      type: "polygon"
      action_type: "slowdown"
      # 1.6 x 1.0 m ahead of and around the robot, in base_footprint.
      points: "[[0.90, 0.50], [0.90, -0.50], [-0.70, -0.50], [-0.70, 0.50]]"
      slowdown_ratio: 0.4
      min_points: 6
      visualize: False
      enabled: False   # see the note above -- disabled, not removed
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      # Kept configured for when the monitor comes back. The earlier note here
      # blamed laser_frame's STL collider, which was removed and did not fix it:
      # the RTX lidar traces visual meshes, not colliders, so the chassis is
      # still there to be seen.
      enabled: False   # see the note above -- disabled, not removed
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      # min_height/max_height apply to PointCloud2 sources only; a "scan" source
      # ignores them. Left in place because they are harmless and removing them
      # invites someone to re-add them for a depth source without noticing.
      min_height: 0.15
      max_height: 2.0
      enabled: False   # see the note above -- disabled, not removed

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
